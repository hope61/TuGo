# Tugo example config
#
# `make service` copies this to /opt/tugo/config.yaml on the first install.
# Change it with `tugo -e`, then `sudo systemctl restart tugo`.
#
#   mode:                              (optional) poll or webhook. defaults to poll
#   interval:                          (optional) poll mode: time between checks, e.g. 30s, 5m, 1h. defaults to 5m
#   timeout:                           (optional) kill a command that runs longer than this. defaults to 30m
#   listen:                            (optional) webhook mode: address to listen on. defaults to :9000
#   url:                               (optional) public webhook url, used by tugo --add-hook / --remove-hook
#   repos:
#     - dir: /absolute/path/to/repo    (required) the local path to the git repo
#       remote: origin                 (optional) defaults to "origin"
#       branch: main                   (optional) defaults to whatever branch the repo is on
#       mode: poll                     (optional) overrides the top-level mode for this repo only
#       commands:                      (optional) run in order after new changes are pulled
#         - npm install && npm run build
#
# Commands only run when there are actual new changes, and stop at the first one that fails.
# The webhook secret isn't in this file. Tugo makes it in webhook.secret next to the binary, readable only by the service user.

mode: poll
interval: 5m

# mode: webhook
# listen: :9000
# url: https://your-host:9000/

repos:
  - dir: /path/to/your/repo

  - dir: /path/to/another/repo
    remote: upstream
    branch: develop
    commands:
      - docker compose up -d --build
